<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabriel Holmquist's Collected Cards Senior Project</title>
  <meta name="description" content="CollectedCardsSeniorProject">
  <meta name="author" content="Gabriel Holmquist">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap');
  </style>
</head>

<body>

  <header>
    <section id="LoggedInHeader">
      <!-- Navigation tabs -->
      <nav class="tab-nav">
        <a href="/index.html"><button id="Logout" class="tab-btn">Logout</button></a>
        <button id="tab-btn-recipes" class="tab-btn active" onclick="switchTab('recipes')">Recipes</button>
        <button id="tab-btn-tasks" class="tab-btn" onclick="switchTab('tasks')">Tasks</button>
      </nav>
        <button id="darkmode-toggle" class="drk-tgl" onclick="toggleDarkMode()">DarkMode/LightMode</button>
    </section>
  </header>

  <main>
    <section>
      <h1>Collected Cards</h1>
    </section>

    <!-- RECIPES VIEW SECTION -->
    <section id="recipes-view" class="view-section">
      <h1>Local Recipe Library</h1>

      <!-- Container where category tabs are dynamically generated -->
      <nav id="category-tabs" class="tabs-nav"></nav>

      <!-- Container where recipes for the selected tab are rendered -->
      <div id="recipe-display"></div>
    </section>

    <!-- TASKS VIEW SECTION  -->
    <section id="tasks-view" class="view-section hidden">
      <h2>Kitchen Tasks</h2>

      <!-- Container to display saved recipes in the tasks view -->
      <div style="margin-top: 2rem;">
        <h3>Active Saved Recipes for Today</h3>
        <ul id="tasks-saved-recipes-list" style="list-style: none; padding: 0; margin-top: 0.5rem;">
          <!-- Populated via JS -->
        </ul>
      </div>
    </section>

    <!-- SIDEBAR (Placed outside the view sections so it stays persistent or handles sidebar duties cleanly) -->
    <aside class="user-sidebar">
      <h3><span id="user-name-header">User</span>'s Saved Recipes</h3>
      
      <div class="add-recipe-box" style="margin-bottom: 1rem; display: flex; gap: 0.5rem;">
        <select id="master-recipe-select" style="flex: 1; padding: 0.35rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.875rem;">
          <option value="">Select a recipe...</option>
        </select>
        <button onclick="addSelectedRecipeFromDropdown()" class="save-btn" style="margin-top: 0;">Add</button>
      </div>

      <ul id="user-saved-list" style="list-style: none; padding: 0;">
        <!-- Populated via JS -->
      </ul>
    </aside>

  </main>

  <footer>
    <p></p>
  </footer>

  <script src="public/scripts/script.js"></script>
</body>
</html>
